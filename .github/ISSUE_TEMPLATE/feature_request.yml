name: ✨ Sugerir uma melhoria
description: Ideia de funcionalidade ou melhoria para o ZapHub
title: "[Sugestão]: "
labels: ["melhoria"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      placeholder: "Hoje, para responder vários clientes iguais, eu preciso..."
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
